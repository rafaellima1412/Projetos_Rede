<svg width="920" height="880" viewBox="0 0 920 880" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="920" height="880" fill="#0f1115"/>
  <text x="460" y="36" text-anchor="middle" fill="#f5f5f5" font-size="20" font-weight="700">Arquitetura atual — validada ponta a ponta</text>
  <text x="460" y="58" text-anchor="middle" fill="#9aa0a6" font-size="13">Verde = testado e funcionando · Amarelo = pendente</text>

  <!-- CPEs -->
  <rect x="340" y="80" width="240" height="56" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="102" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">CPEs simulados</text>
  <text x="460" y="120" text-anchor="middle" fill="#9aa0a6" font-size="11">genieacs-sim (100 devices, -m data_model_extended.csv)</text>
  <line x1="460" y1="136" x2="460" y2="164" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Nginx -->
  <rect x="340" y="166" width="240" height="56" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="188" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Nginx (Load Balancer)</text>
  <text x="460" y="206" text-anchor="middle" fill="#9aa0a6" font-size="11">ip_hash na porta CWMP (7547)</text>
  <line x1="460" y1="222" x2="460" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cluster GenieACS -->
  <rect x="300" y="252" width="320" height="66" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="276" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Cluster GenieACS (genieacs + genieacs-2)</text>
  <text x="460" y="294" text-anchor="middle" fill="#9aa0a6" font-size="11">MongoDB compartilhado (mongo-genieacs)</text>
  <text x="460" y="310" text-anchor="middle" fill="#9aa0a6" font-size="11">Data model estendido (Device.IP/WiFi custom)</text>
  <line x1="460" y1="318" x2="460" y2="346" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Event Ingestor -->
  <rect x="300" y="348" width="320" height="56" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="370" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Event Ingestor (extension GenieACS)</text>
  <text x="460" y="388" text-anchor="middle" fill="#9aa0a6" font-size="11">publish_kafka.js — publica direto via kafkajs</text>
  <line x1="460" y1="404" x2="460" y2="432" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka -->
  <rect x="340" y="434" width="240" height="56" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="456" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Kafka</text>
  <text x="460" y="474" text-anchor="middle" fill="#9aa0a6" font-size="11">tópico: device-events</text>

  <!-- Split -->
  <line x1="460" y1="490" x2="460" y2="510" stroke="#555" stroke-width="1.5"/>
  <line x1="230" y1="510" x2="690" y2="510" stroke="#555" stroke-width="1.5"/>
  <line x1="230" y1="510" x2="230" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="510" x2="690" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Consumer Node.js -->
  <rect x="90" y="540" width="280" height="56" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="230" y="562" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Consumer (Node.js)</text>
  <text x="230" y="580" text-anchor="middle" fill="#9aa0a6" font-size="11">grupo: consumer-postgres-redis</text>

  <!-- n8n pending -->
  <rect x="550" y="540" width="280" height="56" rx="8" fill="#1c2128" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="690" y="562" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">n8n — Kafka Trigger</text>
  <text x="690" y="580" text-anchor="middle" fill="#d4a72c" font-size="11">EM CONSTRUÇÃO — alertas de degradação</text>

  <line x1="230" y1="596" x2="230" y2="624" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="624" x2="310" y2="624" stroke="#555" stroke-width="1.5"/>
  <line x1="150" y1="624" x2="150" y2="652" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="624" x2="310" y2="652" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="30" y="654" width="240" height="70" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="150" y="676" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">PostgreSQL</text>
  <text x="150" y="694" text-anchor="middle" fill="#9aa0a6" font-size="11">device_events, device_lifecycle,</text>
  <text x="150" y="710" text-anchor="middle" fill="#9aa0a6" font-size="11">funil_sucesso_instalacao (view)</text>

  <!-- Redis -->
  <rect x="290" y="654" width="240" height="70" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="410" y="676" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Redis</text>
  <text x="410" y="694" text-anchor="middle" fill="#9aa0a6" font-size="11">cache do último estado</text>
  <text x="410" y="710" text-anchor="middle" fill="#9aa0a6" font-size="11">por CPE (TTL 1h)</text>

  <!-- Kafka UI + Mongo Compass helper row -->
  <rect x="620" y="654" width="270" height="70" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="755" y="676" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600">Ferramentas de apoio</text>
  <text x="755" y="694" text-anchor="middle" fill="#9aa0a6" font-size="11">Kafka UI (:8081) · Mongo Compass (:27017)</text>
  <text x="755" y="710" text-anchor="middle" fill="#9aa0a6" font-size="11">GenieACS UI (:3000)</text>

  <!-- Legend -->
  <rect x="30" y="770" width="16" height="16" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="54" y="783" fill="#9aa0a6" font-size="12">Validado ponta a ponta</text>
  <rect x="230" y="770" width="16" height="16" fill="#1c2128" stroke="#d4a72c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="254" y="783" fill="#9aa0a6" font-size="12">Pendente / próximo passo</text>

  <text x="30" y="820" fill="#6e7681" font-size="11">Gerado com Claude — reflete o estado do projeto em Agosto/2026</text>
</svg>
