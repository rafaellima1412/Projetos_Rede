services:

  ### GenieACS Container - Instância 1 ###
  genieacs:
    depends_on:
      mongo:
        condition: service_healthy
    image: drumsergio/genieacs:1.2.16.0
    restart: unless-stopped
    container_name: genieacs
    environment:
      GENIEACS_UI_JWT_SECRET: changeme
      GENIEACS_CWMP_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-cwmp-access.log
      GENIEACS_NBI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-nbi-access.log
      GENIEACS_FS_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-fs-access.log
      GENIEACS_UI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-ui-access.log
      GENIEACS_DEBUG_FILE: /var/log/genieacs/genieacs-debug.yaml
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs?authSource=admin
    # Sem "ports" -> o Nginx é quem publica as portas no host
    expose:
      - "7547"
      - "7557"
      - "7567"
      - "3000"
    volumes:
      - ext_volume:/opt/genieacs/ext
    networks:
      - genieacs_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ### GenieACS Container - Instância 2 (mesmo banco, mesma config) ###
  genieacs-2:
    depends_on:
      mongo:
        condition: service_healthy
    image: drumsergio/genieacs:1.2.16.0
    restart: unless-stopped
    container_name: genieacs-2
    environment:
      GENIEACS_UI_JWT_SECRET: changeme
      GENIEACS_CWMP_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-cwmp-access.log
      GENIEACS_NBI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-nbi-access.log
      GENIEACS_FS_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-fs-access.log
      GENIEACS_UI_ACCESS_LOG_FILE: /var/log/genieacs/genieacs-ui-access.log
      GENIEACS_DEBUG_FILE: /var/log/genieacs/genieacs-debug.yaml
      GENIEACS_EXT_DIR: /opt/genieacs/ext
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo/genieacs?authSource=admin
    expose:
      - "7547"
      - "7557"
      - "7567"
      - "3000"
    volumes:
      - ext_volume:/opt/genieacs/ext
    networks:
      - genieacs_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ### Load Balancer na frente das 2 instâncias ###
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "7547:7547"
      - "7557:7557"
      - "7567:7567"
      - "3000:3000"
    depends_on:
      genieacs:
        condition: service_healthy
      genieacs-2:
        condition: service_healthy
    networks:
      - genieacs_network

  ### Main GenieACS DB: MongoDB (compartilhado pelas 2 instâncias) ###
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    container_name: mongo-genieacs
    environment:
      MONGO_DATA_DIR: /data/db
      MONGO_LOG_DIR: /var/log/mongodb
    volumes:
      - data_db:/data/db
      - data_configdb:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - genieacs_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  ### Fila de eventos: Kafka (modo KRaft, sem Zookeeper) ###
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - genieacs_network

  ### Interface web pra visualizar tópicos e mensagens do Kafka ###
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - genieacs_network

  ### Ingestor - GenieACS (NBI) -> Kafka ###
  # Polling incremental: consulta dispositivos com _lastInform mais
  # recente que o cursor salvo no Redis, publica 1 evento por CPE no
  # tópico device-events. Serviço fino, sem motor de workflow, feito
  # pra aguentar volume de milhares de CPEs informando com frequência
  # -- esse é o papel que antes estava no n8n.
  ingestor:
    build: ./ingestor
    container_name: ingestor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      NBI_HOST: nginx
      NBI_PORT: 7557
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: device-events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POLL_INTERVAL_MS: 10000
    networks:
      - genieacs_network

  ### n8n - alertas de baixo volume (NÃO é mais a ponte de ingestão) ###
  # Consome o tópico alertas-ftt via Kafka Trigger node do próprio
  # n8n (configurado na UI, não aqui no compose). Esse tópico só
  # recebe o que o "consumer" já processou e decidiu ser relevante
  # (FTT quebrado, degradação confirmada, reincidência) -- baixo
  # volume por natureza, exatamente o cenário que o n8n aguenta bem.
  # Dispara Slack/e-mail/ticket a partir daí.
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "America/Sao_Paulo"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - genieacs_network

  ### PostgreSQL - histórico e funil de sucesso ###
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genieacs_funil
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - genieacs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ### Redis - cache do último estado de cada CPE ###
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - genieacs_network

  ### Consumer - Kafka -> Postgres + Redis ###
  consumer:
    build: ./consumer
    container_name: consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: device-events
      NBI_HOST: nginx
      NBI_PORT: 7557
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: genieacs_funil
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ALERTS_TOPIC: alertas-ftt
      CONSUMER_GROUP_ID: ftt-consumer-group
      RX_POWER_MIN_DBM: -27
      RX_POWER_MAX_DBM: -8
    networks:
      - genieacs_network

volumes:
  data_db:
  pg_data:
  n8n_data:
  data_configdb:
  ext_volume:

networks:
  genieacs_network: