events {
    worker_connections 1024;
}

http {
    # Porta CWMP (7547) - onde os CPEs se conectam
    # ip_hash = sticky session: o mesmo IP de origem sempre cai na
    # mesma instância, evitando o erro "Invalid session" (sessão CWMP
    # fica vinculada ao processo que a iniciou, não pode trocar de
    # instância no meio de uma sessão)
    upstream genieacs_cwmp {
        ip_hash;
        server genieacs:7547;
        server genieacs-2:7547;
    }

    # Porta NBI (7557) - API usada por scripts/n8n/MCP
    upstream genieacs_nbi {
        server genieacs:7557;
        server genieacs-2:7557;
    }

    # Porta FS (7567) - file server (firmware, etc)
    upstream genieacs_fs {
        server genieacs:7567;
        server genieacs-2:7567;
    }

    # Porta UI (3000) - interface web
    upstream genieacs_ui {
        server genieacs:3000;
        server genieacs-2:3000;
    }

    server {
        listen 7547;
        location / {
            proxy_pass http://genieacs_cwmp;
        }
    }

    server {
        listen 7557;
        location / {
            proxy_pass http://genieacs_nbi;
        }
    }

    server {
        listen 7567;
        location / {
            proxy_pass http://genieacs_fs;
        }
    }

    server {
        listen 3000;
        location / {
            proxy_pass http://genieacs_ui;
            # Header de debug: mostra qual instância (IP:porta) respondeu
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}